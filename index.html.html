<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متحف حكايتنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
/* ========== 1) المتغيرات: الألوان والخطوط ========== */
:root {
  --bg: #0b0714;
  --bg-2: #1a0f2e;
  --gold: #e8c26a;
  --gold-soft: #f6e3b0;
  --rose: #d9728f;
  --text: #f3ecff;
  --muted: #b9acd1;

  --font-letter: 'Amiri', serif;              /* الرسائل والخطابات */
  --font-title: 'Aref Ruqaa', serif;          /* العناوين وأسماء القاعات */
  --font-body: 'Noto Naskh Arabic', serif;    /* النص العادي */
  --font-ui: 'Cairo', sans-serif;             /* الأزرار والواجهة */
  --font-en: 'Cormorant Garamond', serif;     /* الجمل الإنجليزي */
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 20%, var(--bg-2), var(--bg) 70%);
  color: var(--text);
  font-family: var(--font-body);
  font-size: clamp(1.05rem, 3.6vw, 1.25rem);
  line-height: 2;
  overflow-x: hidden;
  padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
}

/* نجوم الخلفية */
.stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff8, transparent),
    radial-gradient(1px 1px at 78% 12%, #fff9, transparent),
    radial-gradient(2px 2px at 40% 70%, var(--gold-soft)9, transparent),
    radial-gradient(1px 1px at 88% 62%, #fff8, transparent),
    radial-gradient(1.5px 1.5px at 22% 88%, #fff7, transparent),
    radial-gradient(1px 1px at 62% 40%, #fff6, transparent);
  animation: twinkle 5s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }

/* ========== 2) الشاشات ========== */
.screen {
  position: relative; z-index: 1;
  min-height: 100vh; min-height: 100dvh;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 2rem 1.25rem;
  gap: 1.5rem;
}
.screen.active { display: flex; animation: fadeIn 1s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ========== 3) الخطوط والنصوص ========== */
.museum-title {
  font-family: var(--font-title);
  font-size: clamp(2.6rem, 11vw, 5rem);
  line-height: 1.6;
  color: var(--gold);
  text-shadow: 0 0 30px #e8c26a55;
}
.letter { font-family: var(--font-letter); font-size: 1.2em; line-height: 2.2; }
.lead { font-family: var(--font-letter); font-size: clamp(1.3rem, 5vw, 1.8rem); }
.gold { color: var(--gold); font-weight: 700; text-shadow: 0 0 14px #e8c26a66; }

/* الجمل الإنجليزي (تفضل زي ما هي بالظبط) */
.en {
  direction: ltr; unicode-bidi: isolate;
  font-family: var(--font-en); font-style: italic;
  font-size: clamp(1.25rem, 4.6vw, 1.7rem);
  color: var(--gold-soft); line-height: 1.6;
}

/* ظهور الكلام كلمة كلمة */
.reveal-word {
  display: inline-block; opacity: 0;
  transform: translateY(10px); filter: blur(4px);
  animation: wordIn .9s ease forwards;
}
@keyframes wordIn { to { opacity: 1; transform: none; filter: none; } }

/* ========== 4) الأزرار ========== */
.btn {
  font-family: var(--font-ui); font-weight: 600; font-size: 1.05rem;
  color: var(--bg); background: linear-gradient(135deg, var(--gold), var(--gold-soft));
  border: 0; border-radius: 999px; padding: .85rem 2.4rem;
  cursor: pointer; box-shadow: 0 8px 28px #e8c26a40;
  transition: transform .25s ease, box-shadow .25s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 34px #e8c26a66; }
.btn.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold); box-shadow: none; }

/* ========== 5) قاعة المتحف ========== */
.rooms {
  display: grid; gap: 1rem; width: min(100%, 880px);
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}
.room {
  font-family: var(--font-title); font-size: 1.5rem; line-height: 1.7;
  color: var(--gold-soft); background: #ffffff0a;
  border: 1px solid #e8c26a44; border-radius: 18px;
  padding: 1.6rem 1rem; cursor: pointer;
  backdrop-filter: blur(6px);
  transition: transform .3s ease, border-color .3s ease, background .3s ease;
}
.room:hover { transform: translateY(-4px); border-color: var(--gold); background: #e8c26a14; }
.room small { display: block; font-family: var(--font-ui); font-size: .8rem; color: var(--muted); margin-top: .3rem; }

.toast {
  position: fixed; bottom: calc(1.5rem + env(safe-area-inset-bottom, 0)); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #000c; color: var(--gold-soft); font-family: var(--font-ui);
  padding: .7rem 1.4rem; border-radius: 999px; opacity: 0;
  transition: .4s ease; z-index: 5; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="stars"></div>

<!-- ========== شاشة المدخل ========== -->
<section class="screen active" id="entrance">
  <p class="en" data-reveal>Welcome to your own little universe, Samira.</p>
  <h1 class="museum-title" data-reveal>متحف حكايتنا</h1>
  <p class="lead" data-reveal>أهلًا بيكي في <span class="gold">عالم</span> اتبنى مخصوص علشانك</p>
  <button class="btn" id="enterBtn">ادخلي يا قلبي</button>
</section>

<!-- ========== قاعة المتحف (الرئيسية) ========== -->
<section class="screen" id="hall">
  <h2 class="museum-title" style="font-size:clamp(2rem,8vw,3.4rem)" data-reveal>متحف حكايتنا</h2>
  <p class="lead" data-reveal>اختاري قاعة تدخليها</p>
  <div class="rooms">
    <button class="room" data-room="beauty">قاعة جمالك<small>القاعة الأولى</small></button>
    <button class="room" data-room="memories">حكايتنا وذكرياتنا<small>القاعة التانية</small></button>
    <button class="room" data-room="letters">كلام كان نفسي أقولهولك<small>القاعة التالتة</small></button>
    <button class="room" data-room="world">إنتي عالمي كله<small>القاعة الرابعة</small></button>
    <button class="room" data-room="dreams">أحلامنا سوا<small>القاعة الخامسة</small></button>
  </div>
</section>

<div class="toast" id="toast">القاعة دي لسه بنجهزها ليكي ✨</div>

<script>
/* ========== التنقل بين الشاشات ========== */
function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById(id);
  target.classList.add('active');
  runReveal(target);
  window.scrollTo({ top: 0 });
}

/* ========== ظهور النص كلمة كلمة (من غير تقطيع الحروف علشان التشكيل العربي يفضل سليم) ========== */
function splitWords(node, state) {
  [...node.childNodes].forEach(child => {
    if (child.nodeType === 3) {                       // نص
      const frag = document.createDocumentFragment();
      child.textContent.split(/(\s+)/).forEach(part => {
        if (!part) return;
        if (/^\s+$/.test(part)) { frag.append(' '); return; }
        const w = document.createElement('span');
        w.className = 'reveal-word';
        w.textContent = part;
        w.style.animationDelay = (state.i++ * 0.12) + 's';
        frag.append(w);
      });
      child.replaceWith(frag);
    } else if (child.nodeType === 1) {
      splitWords(child, state);                       // عناصر جوه (زي .gold)
    }
  });
}
function runReveal(scope) {
  const state = { i: 0 };
  scope.querySelectorAll('[data-reveal]').forEach(el => {
    if (!el.dataset.done) { splitWords(el, state); el.dataset.done = '1'; }
  });
}

/* ========== الأحداث ========== */
runReveal(document.getElementById('entrance'));
document.getElementById('enterBtn').addEventListener('click', () => go('hall'));

const toast = document.getElementById('toast');
document.querySelectorAll('.room').forEach(btn => {
  btn.addEventListener('click', () => {
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  });
});
</script>
</body>
</html>
