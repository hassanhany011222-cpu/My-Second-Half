<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متحف حكايتنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
/* ========== 1) المتغيرات ========== */
:root {
  --bg: #0b0714; --bg-2: #1a0f2e;
  --gold: #e8c26a; --gold-soft: #f6e3b0; --rose: #d9728f;
  --text: #f3ecff; --muted: #b9acd1;
  --font-letter: 'Amiri', serif;
  --font-title: 'Aref Ruqaa', serif;
  --font-body: 'Noto Naskh Arabic', serif;
  --font-ui: 'Cairo', sans-serif;
  --font-en: 'Cormorant Garamond', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 20%, var(--bg-2), var(--bg) 70%) fixed;
  color: var(--text); font-family: var(--font-body);
  font-size: clamp(1.05rem, 3.6vw, 1.25rem); line-height: 2;
  overflow-x: hidden;
  padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
}
.stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff8, transparent),
    radial-gradient(1px 1px at 78% 12%, #fff9, transparent),
    radial-gradient(2px 2px at 40% 70%, #f6e3b099, transparent),
    radial-gradient(1px 1px at 88% 62%, #fff8, transparent),
    radial-gradient(1.5px 1.5px at 22% 88%, #fff7, transparent),
    radial-gradient(1px 1px at 62% 40%, #fff6, transparent);
  animation: twinkle 5s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }

/* ========== 2) الشاشات ========== */
.screen {
  position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 2rem 1.25rem; gap: 1.5rem;
}
.screen.active { display: flex; animation: fadeIn 1s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.room-screen { justify-content: flex-start; padding-top: 3.5rem; padding-bottom: 3rem; }

/* ========== 3) النصوص ========== */
.museum-title {
  font-family: var(--font-title); font-size: clamp(2.6rem, 11vw, 5rem);
  line-height: 1.6; color: var(--gold); text-shadow: 0 0 30px #e8c26a55;
}
.room-title {
  font-family: var(--font-title); color: var(--gold);
  font-size: clamp(2.2rem, 9vw, 3.6rem); line-height: 1.6; text-shadow: 0 0 26px #e8c26a55;
}
.letter { font-family: var(--font-letter); font-size: 1.2em; line-height: 2.2; }
.lead { font-family: var(--font-letter); font-size: clamp(1.3rem, 5vw, 1.8rem); }
.room-text { max-width: 34rem; }
.gold { color: var(--gold); font-weight: 700; text-shadow: 0 0 14px #e8c26a66; }
.hint { font-family: var(--font-ui); font-size: .85rem; color: var(--muted); }
.divider { width: 90px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.en {
  direction: ltr; unicode-bidi: isolate; font-family: var(--font-en); font-style: italic;
  font-size: clamp(1.25rem, 4.6vw, 1.7rem); color: var(--gold-soft); line-height: 1.6;
}
.reveal-word {
  display: inline-block; opacity: 0; transform: translateY(10px); filter: blur(4px);
  animation: wordIn .9s ease forwards;
}
@keyframes wordIn { to { opacity: 1; transform: none; filter: none; } }

/* ========== 4) الأزرار ========== */
.btn {
  font-family: var(--font-ui); font-weight: 600; font-size: 1.05rem;
  color: var(--bg); background: linear-gradient(135deg, var(--gold), var(--gold-soft));
  border: 0; border-radius: 999px; padding: .85rem 2.4rem; cursor: pointer;
  box-shadow: 0 8px 28px #e8c26a40; transition: transform .25s ease, box-shadow .25s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 34px #e8c26a66; }
.btn.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold); box-shadow: none; }
.btn.big { font-size: clamp(1.2rem, 5vw, 1.7rem); padding: 1.1rem 2.6rem; direction: ltr; }
.back { margin-top: 1rem; }

/* ========== 5) القاعة الرئيسية ========== */
.rooms { display: grid; gap: 1rem; width: min(100%, 880px); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.room {
  position: relative; font-family: var(--font-title); font-size: 1.5rem; line-height: 1.7;
  color: var(--gold-soft); background: #ffffff0a; border: 1px solid #e8c26a44; border-radius: 18px;
  padding: 1.6rem 1rem; cursor: pointer; backdrop-filter: blur(6px);
  transition: transform .3s ease, border-color .3s ease, background .3s ease;
}
.room:hover { transform: translateY(-4px); border-color: var(--gold); background: #e8c26a14; }
.room small { display: block; font-family: var(--font-ui); font-size: .8rem; color: var(--muted); margin-top: .3rem; }
.room.done::after { content: "✓"; position: absolute; top: .6rem; left: .9rem; font-family: var(--font-ui); font-size: 1rem; color: var(--gold); }
#puzzleBtn { display: none; }
#puzzleBtn.show { display: inline-block; animation: fadeIn 1s ease both; }

/* ========== 6) قاعة جمالك ========== */
.frames { display: grid; gap: 1.6rem; width: min(100%, 900px); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin: .5rem 0; }
.frame { margin: 0; }
.frame .art {
  position: relative; aspect-ratio: 3 / 4; overflow: hidden; border: 2px solid var(--gold);
  border-radius: 6px; padding: 8px; background: #120a20;
  box-shadow: 0 0 0 6px #e8c26a22, 0 20px 50px #000a; display: grid; place-items: center;
}
.frame .art::before { content: "❤"; position: absolute; font-size: 3rem; color: var(--rose); opacity: .5; }
.frame .art img { position: relative; width: 100%; height: 100%; object-fit: cover; border-radius: 2px; }
.frame figcaption { font-family: var(--font-letter); font-size: 1.2rem; color: var(--gold-soft); margin-top: 1rem; line-height: 1.9; }

/* ========== 7) الذكريات (خط زمني) ========== */
.timeline { width: min(100%, 560px); text-align: right; position: relative; padding-right: 2rem; }
.timeline::before { content: ""; position: absolute; right: 7px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(var(--gold), transparent); }
.moment { position: relative; margin-bottom: 2rem; }
.moment::before {
  content: ""; position: absolute; right: -2rem; top: .9rem; width: 16px; height: 16px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 16px var(--gold);
}
.moment h3 { font-family: var(--font-title); color: var(--gold); font-size: 1.6rem; font-weight: 400; line-height: 1.7; }
.moment p { font-family: var(--font-body); color: var(--text); }

/* ========== 8) الرسالة ========== */
.envelope { font-size: 5rem; cursor: pointer; animation: float 3s ease-in-out infinite; background: none; border: 0; filter: drop-shadow(0 0 20px #e8c26a66); }
@keyframes float { 50% { transform: translateY(-10px); } }
.paper {
  display: none; width: min(100%, 560px); text-align: right;
  background: linear-gradient(160deg, #2a1a45cc, #150c25cc); border: 1px solid #e8c26a55;
  border-radius: 16px; padding: 2rem 1.6rem; box-shadow: 0 20px 60px #000a;
}
.paper.open { display: block; }
.paper p { margin-bottom: 1.1rem; }

/* ========== 9) عالمي كله (نجوم) ========== */
.sky { position: relative; width: min(100%, 520px); height: 300px; }
.star {
  position: absolute; background: none; border: 0; font-size: 2.2rem; color: var(--gold);
  cursor: pointer; text-shadow: 0 0 18px var(--gold); animation: pulse 2.4s ease-in-out infinite;
  padding: .5rem;
}
.star:nth-child(2n) { animation-delay: .8s; }
.star:nth-child(3n) { animation-delay: 1.5s; }
.star.seen { color: var(--rose); text-shadow: 0 0 18px var(--rose); }
@keyframes pulse { 50% { transform: scale(1.25); opacity: .75; } }
.reason {
  min-height: 4.5rem; max-width: 30rem; font-family: var(--font-letter); font-size: 1.5rem;
  color: var(--gold-soft); line-height: 1.9;
}

/* ========== 10) الأحلام ========== */
.dreams { display: grid; gap: 1rem; width: min(100%, 560px); }
.dream {
  font-family: var(--font-letter); font-size: 1.3rem; line-height: 1.9; color: var(--text);
  background: #ffffff0a; border: 1px dashed #e8c26a55; border-radius: 16px; padding: 1.1rem 1.2rem;
  cursor: pointer; transition: .4s ease;
}
.dream.lit { background: #e8c26a1c; border: 1px solid var(--gold); color: var(--gold-soft); box-shadow: 0 0 28px #e8c26a40; }

/* ========== 11) اللغز ========== */
.options { display: grid; gap: .8rem; width: min(100%, 420px); }
.opt {
  font-family: var(--font-ui); font-size: 1.1rem; color: var(--text); background: #ffffff0d;
  border: 1px solid #e8c26a55; border-radius: 14px; padding: .9rem 1rem; cursor: pointer; transition: .25s ease;
}
.opt:hover { border-color: var(--gold); background: #e8c26a14; }
.opt.wrong { animation: shake .4s; border-color: var(--rose); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.feedback { min-height: 2rem; font-family: var(--font-ui); color: var(--rose); }

/* ========== 12) النهاية ========== */
.hearts { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.heart { position: absolute; bottom: -2rem; animation: rise linear forwards; }
@keyframes rise { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
#finalMsg { display: none; }
#finalMsg.show { display: block; }

.music-btn {
  display: none; position: fixed; z-index: 6; left: 1rem; top: calc(1rem + env(safe-area-inset-top, 0px));
  width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--gold);
  background: #000a; color: var(--gold); font-size: 1.3rem; cursor: pointer; backdrop-filter: blur(6px);
}
.music-btn.show { display: block; }
.music-btn.off { opacity: .5; text-decoration: line-through; }

.toast {
  position: fixed; bottom: calc(1.5rem + env(safe-area-inset-bottom, 0)); left: 50%;
  transform: translateX(-50%) translateY(20px); background: #000c; color: var(--gold-soft);
  font-family: var(--font-ui); padding: .7rem 1.4rem; border-radius: 999px; opacity: 0;
  transition: .4s ease; z-index: 5; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%); }

/* ========== شاشة القفل ========== */
.lock { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  padding: 1.5rem; overflow: auto; background: radial-gradient(ellipse at 50% 20%, var(--bg-2), var(--bg) 70%);
  transition: opacity .9s ease; }
.lock.leaving { opacity: 0; pointer-events: none; }
.lock-card { width: min(100%, 380px); display: grid; gap: 1.1rem; text-align: center; }
.lock-icon { font-size: 2.6rem; filter: drop-shadow(0 0 18px #e8c26a88); }
.lock input { font-family: var(--font-ui); font-size: 1.4rem; text-align: center; direction: ltr; letter-spacing: .08em;
  color: var(--text); background: #ffffff10; border: 1px solid var(--gold); border-radius: 14px; padding: .8rem; outline: none; }
.lock input:focus { box-shadow: 0 0 24px #e8c26a55; }
.lock .btn:disabled { opacity: .6; cursor: wait; }
.lock-card.shake { animation: shake .4s; }
.bio-offer { position: fixed; z-index: 30; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 30px); width: min(92%, 380px); text-align: center; opacity: 0; pointer-events: none;
  background: #140b24f2; border: 1px solid var(--gold); border-radius: 18px; padding: 1.1rem; transition: .5s ease;
  font-family: var(--font-ui); font-size: .95rem; line-height: 1.8; }
.bio-offer.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.bio-actions { display: flex; gap: .6rem; justify-content: center; margin-top: .6rem; }
.bio-actions .btn { padding: .55rem 1.4rem; font-size: .95rem; }
</style>
</head>
<body>
<div class="stars"></div>
<div id="app"></div>

<!-- ========== شاشة القفل ========== -->
<section class="lock" id="lock">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h1 class="museum-title" style="font-size:clamp(2.2rem,10vw,3.4rem)">متحف حكايتنا</h1>
    <p class="lead">المتحف ده ليكي إنتي بس</p>
    <input id="pw" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="يوم / شهر / سنة" aria-label="تاريخ الميلاد">
    <button class="btn" id="unlockBtn">افتحي</button>
    <button class="btn ghost" id="bioBtn" hidden>افتحي بالبصمة أو Face ID</button>
    <p class="hint">تلميح: اليوم اللي جت فيه أحلى حد على قلبي كله 🤍</p>
    <p class="feedback" id="lockMsg"></p>
  </div>
</section>

<!-- عرض تفعيل البصمة (بيظهر بعد أول دخول) -->
<div class="bio-offer" id="bioOffer">
  <p>تحبي تفتحي المتحف بالبصمة أو Face ID المرة الجاية؟</p>
  <div class="bio-actions">
    <button class="btn" id="bioYes">أيوه</button>
    <button class="btn ghost" id="bioNo">لا شكرًا</button>
  </div>
</div>

const ITER = 300000;
const LS = { id: 'museum_pk_id', key: 'museum_pk_key', skip: 'museum_pk_skip' };

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u8 => btoa(String.fromCharCode(...u8));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const pad = (n, l) => String(n).padStart(l, '0');

/* ---------- التشفير ---------- */
async function deriveKey(canon) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(canon), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(P.salt), iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function decryptWith(key) {
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}

/* ---------- قراءة التاريخ بأكتر من شكل (أرقام عربي أو إنجليزي) ---------- */
function candidates(raw) {
  const s = raw
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const out = new Set();
  const parts = s.split(/\D+/).filter(Boolean);
  if (parts.length === 3) {
    const [a, b, c] = parts;
    if (c.length === 4) out.add(pad(a, 2) + pad(b, 2) + c);        // يوم/شهر/سنة
    if (a.length === 4) out.add(pad(c, 2) + pad(b, 2) + a);        // سنة/شهر/يوم
  } else {
    const d = s.replace(/\D/g, '');
    if (d.length === 8) {
      out.add(d);
      if (/^(19|20)/.test(d)) out.add(d.slice(6, 8) + d.slice(4, 6) + d.slice(0, 4));
    } else if (d.length === 7) {
      out.add(d.slice(0, 2) + '0' + d.slice(2));                    // يوم يومين + شهر رقم واحد
      out.add('0' + d);                                             // يوم رقم واحد + شهر رقمين
    }
  }
  return [...out];
}

/* ---------- فتح المتحف ---------- */
async function openMuseum(data, key) {
  $('app').innerHTML = data.html;
  const s = document.createElement('script');
  s.textContent = data.js;
  document.body.appendChild(s);
  const lock = $('lock');
  lock.classList.add('leaving');
  setTimeout(() => lock.remove(), 900);
  if (key) offerBio(key);
}

async function tryUnlock() {
  const msg = $('lockMsg'), btn = $('unlockBtn');
  msg.textContent = '';
  if (!window.crypto || !crypto.subtle) {
    msg.textContent = 'افتحي الموقع من الرابط (https) علشان يشتغل.';
    return;
  }
  btn.disabled = true; btn.textContent = '...';
  for (const c of candidates($('pw').value.trim())) {
    try {
      const key = await deriveKey(c);
      const data = await decryptWith(key);
      await openMuseum(data, key);
      return;
    } catch (e) { /* جرّب الشكل التاني */ }
  }
  btn.disabled = false; btn.textContent = 'افتحي';
  msg.textContent = 'مش هو ده التاريخ... فكري تاني 🤍';
  const card = document.querySelector('.lock-card');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
}
$('unlockBtn').addEventListener('click', tryUnlock);
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

/* ---------- البصمة / Face ID (Passkey) ---------- */
async function bioAvailable() {
  try {
    return !!(window.PublicKeyCredential && window.isSecureContext &&
      await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  } catch (e) { return false; }
}
async function registerBio(key) {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: rnd(32),
    rp: { name: 'متحف حكايتنا' },
    user: { id: rnd(16), name: 'soso', displayName: 'سوسو' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
    timeout: 60000, attestation: 'none'
  }});
  const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
  localStorage.setItem(LS.id, toB64(new Uint8Array(cred.rawId)));
  localStorage.setItem(LS.key, toB64(raw));
}
async function bioUnlock() {
  const msg = $('lockMsg');
  try {
    await navigator.credentials.get({ publicKey: {
      challenge: rnd(32),
      allowCredentials: [{ type: 'public-key', id: b64(localStorage.getItem(LS.id)) }],
      userVerification: 'required', timeout: 60000
    }});
    const key = await crypto.subtle.importKey('raw', b64(localStorage.getItem(LS.key)), 'AES-GCM', false, ['decrypt']);
    await openMuseum(await decryptWith(key), null);
  } catch (e) {
    msg.textContent = 'مقدرتش أفتح بالبصمة، اكتبي التاريخ من فضلك 🤍';
  }
}
async function offerBio(key) {
  if (localStorage.getItem(LS.id) || localStorage.getItem(LS.skip) || !(await bioAvailable())) return;
  const box = $('bioOffer');
  setTimeout(() => box.classList.add('show'), 1500);
  $('bioNo').onclick = () => { localStorage.setItem(LS.skip, '1'); box.classList.remove('show'); };
  $('bioYes').onclick = async () => {
    try { await registerBio(key); } catch (e) { /* لو اترفضت مفيش مشكلة */ }
    box.classList.remove('show');
  };
}
(async () => {
  if (localStorage.getItem(LS.id) && localStorage.getItem(LS.key) && await bioAvailable()) {
    $('bioBtn').hidden = false;
    $('bioBtn').addEventListener('click', bioUnlock);
  }
})();
</script>
